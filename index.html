<!doctype html>
<html lang="ko" data-ink="black">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>냉장고 문 시퀀스: 새는 빛</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>
  :root{ --ground:#ffffff; --mark:#000000; --quiet:#666666; }
  :root[data-ink="white"]{ --ground:#000000; --mark:#ffffff; --quiet:#a0a0a0; }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--ground); color:var(--mark); overflow:hidden;
    font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-size:14px; line-height:1.4;
  }
  #field{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:ew-resize; }

  #panel{
    position:fixed; left:10px; right:10px; bottom:max(10px, env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto; padding:10px 12px 12px; color:#e9e9e9; font-size:13px;
    background:rgba(8,8,10,.78); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.22); display:grid; gap:9px;
    transition:transform .25s ease, opacity .25s ease;
  }
  #panel.folded{ transform:translateY(calc(100% + 20px)); opacity:0; pointer-events:none; }
  #pill{
    position:fixed; left:50%; bottom:max(12px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:none; align-items:center; gap:10px; padding:7px 14px; min-height:36px;
    background:rgba(8,8,10,.72); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.25); color:#fff; font:inherit; font-size:13px; cursor:pointer;
  }
  body.folded #pill{ display:flex; }
  #pill b{ font-weight:500; }
  #pill span{ color:rgba(255,255,255,.6); font-variant-numeric:tabular-nums; }

  .top{ display:flex; align-items:center; gap:10px; }
  .top output{ flex:0 0 3.4em; font-size:20px; font-weight:500; color:#fff; font-variant-numeric:tabular-nums; text-align:right; }
  .icon{ flex:0 0 38px; min-width:38px; height:38px; padding:0; font-size:15px; display:grid; place-items:center; }

  input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1 1 auto; min-width:0;
    height:38px; margin:0; background:transparent; cursor:pointer; touch-action:none;
  }
  input[type=range]::-webkit-slider-runnable-track{ height:2px; background:linear-gradient(90deg, rgba(255,255,255,.9) var(--p,0%), rgba(255,255,255,.25) var(--p,0%)); }
  input[type=range]::-moz-range-track{ height:2px; background:rgba(255,255,255,.25); }
  input[type=range]::-moz-range-progress{ height:2px; background:rgba(255,255,255,.9); }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; margin-top:-8px; border:0; border-radius:50%;
    background:#fff; box-shadow:0 0 12px rgba(255,255,255,.8);
  }
  input[type=range]::-moz-range-thumb{ width:18px; height:18px; border:0; border-radius:50%; background:#fff; box-shadow:0 0 12px rgba(255,255,255,.8); }

  .row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .seg{ display:flex; }
  .seg button + button{ border-left-width:0; }
  .spacer{ flex:1 1 auto; }
  .chips{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin:0 -12px; padding:0 12px; scroll-snap-type:x proximity; }
  .chips::-webkit-scrollbar{ display:none; }
  .chips button{ flex:0 0 auto; scroll-snap-align:start; display:flex; align-items:baseline; gap:6px; }
  .chips button i{ font-style:normal; opacity:.55; font-size:11px; }
  .label{ color:rgba(255,255,255,.45); font-size:12px; margin-right:2px; }
  .hint{ color:rgba(255,255,255,.38); font-size:11px; }
  @media (hover:none){ .hint{ display:none; } }

  button{
    font:inherit; color:#e9e9e9; background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.22); border-radius:0;
    padding:6px 11px; min-height:34px; cursor:pointer; white-space:nowrap;
  }
  button:hover{ border-color:rgba(255,255,255,.6); }
  button[aria-pressed="true"]{ background:#f4f4f4; color:#000; border-color:#f4f4f4; }
  button:focus-visible, input[type=range]:focus-visible{ outline:1px solid #fff; outline-offset:3px; }
  #backBtn{
    position:fixed; z-index:4; left:max(10px, env(safe-area-inset-left)); top:max(10px, env(safe-area-inset-top));
    background:rgba(8,8,10,.72); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.28); color:#fff; font-size:13px; padding:6px 12px 6px 10px; min-height:36px;
  }
  #backBtn:hover{ border-color:rgba(255,255,255,.7); }
  body.grid #backBtn{ display:none; }
  #sndStat{ color:rgba(255,255,255,.55); font-size:12px; font-variant-numeric:tabular-nums; }
  #dropHint{
    position:fixed; inset:12px; z-index:5; display:grid; place-items:center; pointer-events:none;
    border:1px dashed rgba(255,255,255,.7); background:rgba(0,0,0,.45); color:#fff; font-size:15px;
  }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<button id="backBtn" type="button" aria-label="전체 보기로 돌아가기" title="전체 보기 (Esc)">← 전체 보기</button>
<canvas id="field" aria-label="냉장고 문이 닫힐수록 좁아지고 격해지는 빛을 기호로 그린 화면. 좌우로 끌면 문이 움직입니다."></canvas>

<section id="panel" aria-label="조절 패널">
  <div class="top">
    <button id="auto" class="icon" type="button" aria-pressed="true" aria-label="자동으로 여닫기" title="자동 재생 (Space)">❚❚</button>
    <input id="deg" type="range" min="0" max="110" step="0.1" value="0" aria-label="문 각도">
    <output id="degOut" for="deg">0°</output>
    <button id="fold" class="icon" type="button" aria-label="패널 숨기기" title="패널 숨기기 (H · 화면 두 번 탭)">▾</button>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="빠른 각도">
      <button type="button" data-goto="0">닫힘</button>
      <button type="button" data-goto="12">틈</button>
      <button type="button" data-goto="55">반</button>
      <button type="button" data-goto="110">활짝</button>
    </div>
    <button id="gridBtn" type="button" aria-pressed="false" title="3×3 미리보기 (G)">그리드</button>
    <button id="qBtn" type="button" title="그리는 해상도 (Q)">화질 자동</button>
    <button id="senBtn" type="button" aria-pressed="false" title="카메라 밝기로 문 판정">센서</button>
    <button id="calBtn" type="button" style="display:none" title="지금을 닫힘으로 기준 삼기">닫힘 보정</button>
    <button id="calOBtn" type="button" style="display:none" title="지금을 활짝 열린 상태로 기준 삼기">열림 보정</button>
    <span class="spacer"></span>
    <span id="inkGroup" class="seg" role="group" aria-label="바탕">
      <button type="button" data-ink="black" aria-pressed="true">흰 바탕</button>
      <button type="button" data-ink="white" aria-pressed="false">검은 바탕</button>
    </span>
    <div class="seg" role="group" aria-label="화면" id="viewSeg">
      <button type="button" data-view="fridge" aria-pressed="true">냉장고</button>
      <button type="button" data-view="abstract" aria-pressed="false">추상</button>
    </div>
  </div>
  <div class="chips" role="group" aria-label="디자인 타입">
    <button type="button" data-type="A" aria-pressed="true"><i>A</i>흑백 물결</button>
    <button type="button" data-type="B" aria-pressed="false"><i>B</i>잉크 선</button>
    <button type="button" data-type="C" aria-pressed="false"><i>C</i>열화상</button>
    <button type="button" data-type="D" aria-pressed="false"><i>D</i>성운</button>
    <button type="button" data-type="E" aria-pressed="false"><i>E</i>필름</button>
    <button type="button" data-type="F" aria-pressed="false"><i>F</i>픽셀 소팅</button>
    <button type="button" data-type="G" aria-pressed="false"><i>G</i>액체 크롬</button>
    <button type="button" data-type="H" aria-pressed="false"><i>H</i>서툰 모델링</button>
  </div>
  <div class="row" role="group" aria-label="소리">
    <button id="sndBtn" type="button" aria-pressed="false" title="소리 켜기 (M)">소리</button>
    <button id="sndAdd" type="button" title="노래 파일 넣기 (이름이 1–9 또는 A–H로 시작하면 그 칸으로)">노래 넣기</button>
    <button id="testBtn" type="button" title="칸마다 컨셉에 맞춘 시험용 루프를 넣습니다">시험용 루프</button>
    <input id="sndFile" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac" multiple hidden>
    <span class="spacer"></span>
    <span id="sndStat">노래 0/9</span>
  </div>
  <div class="row hint">←→ 각도 · Space 재생 · 1–8 타입 · G 그리드 · Esc 전체 보기 · M 소리 · Q 화질 · V 화면 · H 숨김 · 파일을 칸에 끌어다 놓기</div>
</section>
<div id="dropHint" hidden>여기에 놓으면 노래가 들어갑니다</div>
<button id="pill" type="button" aria-label="조절 패널 펴기"><b id="pillType">A 흑백 물결</b><span id="pillDeg">0°</span>▴</button></section>

<script>
(() => {
  let cv = document.getElementById('field'), ctx = cv.getContext('2d');
  const mainCv = cv, mainCtx = ctx;
  const src = document.createElement('canvas'), sctx = src.getContext('2d');
  const small = document.createElement('canvas'), smctx = small.getContext('2d', { willReadFrequently: true });
  const GLOW = [0, 1, 2, 3].map(() => { const c = document.createElement('canvas'); return { c, x: c.getContext('2d') }; });
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state = { deg: 0, auto: !reduce, mode: 'seq', view: 'fridge', type: 'A', grid: false };

  const CLOSED = 5;                 // 이 각도 아래는 '닫힘' (후하게)
  let sndUiTick = 0;
  let rs = 1, rsIdx = 5, ftEMA = 16, qMode = 'auto', qTick = 0, dirty = 2, lastSig = '';
  const RS = [0.44, 0.52, 0.62, 0.74, 0.86, 1];
  let W = 0, H = 0, dpr = 1, s = 24, cols = 0, rows = 0, offX = 0, offY = 0, scale = 1;
  let dens = null;
  let last = performance.now(), clock = 0, ph = 0, live = 0, wasOpen = false;
  let offT = -1, offEnd = 1, darkGround = false;   // offT: 점들이 꺼지는 중의 경과 시간 (음수면 아님)
  let ink = '#fff', ground = '#000', inkMode = 'black';
  let sweep = 0, swX = 0, swY = 0, kc = 0, vivP = 0, glowAmt = 0, glowTint = null, cellZ = 1, volGl = 0;   // cellZ: 이 칸이 카메라에 얼마나 가까운가 (원근)
  const IMG = document.createElement('canvas'), ictx = IMG.getContext('2d');
  const UP = document.createElement('canvas'), uctx = UP.getContext('2d');
  let imgData = null, grainTiles = null, grainIdx = 0, grainTick = 0, FRES = null, FIELD = null, BURN = null;
  const CH = [0, 1, 2].map(() => { const c = document.createElement('canvas'); return { c, x: c.getContext('2d') }; });
  const MOTES = [];                                   // 빛 속을 떠도는 먼지: 원근과 공간감을 만든다
  let volState = null, curA = 0;                                // 이번 프레임의 빛 부피 (틈의 각도 등)
  const RMAX = 0.46;   // 점은 서로 닿을 뿐 뭉개지지 않는다: 끝까지 LED 격자로 남는다
  // 반시계로 도는 네온 띠: 빨강 → 자홍 → 파랑 → 청록 → 초록 → (노랑) → 빨강. 색마다 고원이 있고 그 사이는 부드럽게 넘어간다
  const NCOL = 64, IDX_CLOSED = 64, IDX_WHITE = 65, PAL = new Array(130), HOT = 66;
  PAL[IDX_CLOSED] = '#d2d2d2'; PAL[IDX_WHITE] = '#ffffff';
  const lineB = new Map(), dotB = new Map(), rectB = new Map();

  // 냉장고 화면의 카메라: 정면, 약간 위에서 내려다보는 광각
  const cam = { x: -0.75, y: 1.35, z: 2.3 }, PITCH = 0.1, cp = Math.cos(PITCH), sp = Math.sin(PITCH);
  const BW = 1, BH = 1.9, BD = 0.9, WALLZ = -1.25, LAMPZ = -0.34, LAMPS = [-0.18, 0, 0.18];
  let F = 500, cx = 0, cy = 0;


  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
  const hash = (i, j) => { let n = (i | 0) * 374761393 + (j | 0) * 668265263; n = (n ^ (n >>> 13)) * 1274126177; return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };

  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    ink = cs.getPropertyValue('--mark').trim() || '#fff';
    ground = cs.getPropertyValue('--ground').trim() || '#000';
    inkMode = document.documentElement.getAttribute('data-ink') || 'black';
  }

  // 열린 틈을 중심으로 반시계로 도는 색. 활짝 열리면 검정 근처의 스펙트럼, 닫힐수록 쨍한 단색 조각
  function cellColor(x, y) {
    if (live < 0.5) return IDX_CLOSED;
    let tr;
    if (state.type === 'A') {                        // 흑백: 틈에서 퍼지는 동심원과 도는 부챗살이 겹쳐 물결이 된다
      const dd = Math.hypot(x - swX, y - swY) / scale, aa = Math.atan2(y - swY, x - swX);
      tr = 0.5 + 0.22 * (fbm(dd * 2.2 - ph * 0.02, aa * 0.8 - sweep * 0.3) - 0.5) + 0.1 * Math.cos(aa - sweep);   // 동심원 대신 느린 얼룩: 물결이 아니라 빛의 번짐
    } else {
      tr = (Math.atan2(y - swY, x - swX) - sweep) / (2 * Math.PI) + 0.3 * Math.hypot(x - swX, y - swY) / scale;
      tr -= Math.floor(tr);
    }
    return clamp(Math.floor(tr * NCOL), 0, NCOL - 1);
  }
  // A: 순수한 흑백. 물결의 마루와 골이 밝기 차이로만 나타나고, 닫힐수록 대비가 벌어진다
  function buildPaletteA(dark, c) {
    const lo = dark ? 20 : 238, hi = dark ? 255 : 0;
    for (let n = 0; n < NCOL; n++) {
      const g = Math.round(lo + (hi - lo) * clamp(0.5 + (0.45 + 0.55 * c) * (n / (NCOL - 1) - 0.5) * 2, 0, 1));
      PAL[n] = 'rgb(' + g + ',' + g + ',' + g + ')';
      const wg = dark ? 255 : Math.round(g * 0.2);
      PAL[HOT + n] = 'rgb(' + wg + ',' + wg + ',' + wg + ')';
    }
    PAL[IDX_CLOSED] = dark ? '#d2d2d2' : '#161616'; PAL[IDX_WHITE] = dark ? '#ffffff' : '#000000';
  }
  // B: 형광 분홍과 파랑, 두 가지 잉크. 활짝 열렸을 땐 먹색에 가깝다가 닫힐수록 형광으로 뜬다
  function buildPaletteB(v) {
    const INK = [[255, 72, 176], [104, 60, 190], [0, 120, 215], [104, 60, 190]], D0 = [24, 22, 30];
    for (let n = 0; n < NCOL; n++) {
      const t = n / NCOL * 4, m = Math.floor(t) % 4, f = sstep(0, 1, t - Math.floor(t)), P = INK[m], Q = INK[(m + 1) % 4];
      let c = ''; for (let q = 0; q < 3; q++) { const neon = P[q] + (Q[q] - P[q]) * f; c += (q ? ',' : '') + Math.round(D0[q] + (neon - D0[q]) * v); }
      PAL[n] = PAL[HOT + n] = 'rgb(' + c + ')';
    }
    PAL[IDX_CLOSED] = '#1b1a1f'; PAL[IDX_WHITE] = '#1b1a1f';
  }
  // C: 열화상. 색은 방향이 아니라 온도다
  const IRON = [[0, 8, 5, 16], [0.18, 30, 12, 96], [0.4, 128, 16, 170], [0.6, 228, 38, 104], [0.76, 255, 124, 24], [0.9, 255, 218, 60], [1, 255, 255, 255]];
  function buildPaletteC() {
    for (let n = 0; n < NCOL; n++) {
      const t = n / (NCOL - 1); let m = 0; while (m < IRON.length - 2 && t >= IRON[m + 1][0]) m++;
      const P = IRON[m], Q = IRON[m + 1], f = clamp((t - P[0]) / (Q[0] - P[0]), 0, 1);
      PAL[n] = PAL[HOT + n] = 'rgb(' + Math.round(P[1] + (Q[1] - P[1]) * f) + ',' + Math.round(P[2] + (Q[2] - P[2]) * f) + ',' + Math.round(P[3] + (Q[3] - P[3]) * f) + ')';
    }
    PAL[IDX_CLOSED] = '#7a72b4'; PAL[IDX_WHITE] = '#ffffff';
  }
  function seg(ci, lw, x1, y1, x2, y2) {
    const key = ci * 256 + Math.max(2, Math.min(255, Math.round(lw * 4)));
    let a = lineB.get(key); if (!a) { a = []; lineB.set(key, a); }
    a.push(x1, y1, x2, y2);
  }
  function dot(ci, x, y, r) {
    if (r < 0.25) return;
    let a = dotB.get(ci); if (!a) { a = []; dotB.set(ci, a); }
    a.push(x, y, r);
  }
  function rect(ci, x, y, side) {
    if (side < 0.5) return;
    let a = rectB.get(ci); if (!a) { a = []; rectB.set(ci, a); }
    a.push(x - side / 2, y - side / 2, side);
  }
  function flush() {
    if ('DEFG'.includes(state.type)) { flushImage(); if (state.type === 'D') ctx.globalCompositeOperation = 'lighter'; }
    for (const [ci, a] of rectB) {
      if (!a.length) continue;
      ctx.fillStyle = PAL[ci]; ctx.beginPath();
      for (let n = 0; n < a.length; n += 3) ctx.rect(a[n], a[n + 1], a[n + 2], a[n + 2]);
      ctx.fill(); a.length = 0;
    }
    for (const [ci, a] of dotB) {
      if (!a.length) continue;
      ctx.fillStyle = PAL[ci]; ctx.beginPath();
      for (let n = 0; n < a.length; n += 3) { ctx.moveTo(a[n] + a[n + 2], a[n + 1]); ctx.arc(a[n], a[n + 1], a[n + 2], 0, 6.2832); }
      ctx.fill(); a.length = 0;
    }
    ctx.lineCap = state.type === 'B' ? 'butt' : 'round';
    for (const [key, a] of lineB) {
      if (!a.length) continue;
      ctx.strokeStyle = PAL[key >> 8]; ctx.lineWidth = (key & 255) / 4; ctx.beginPath();
      for (let n = 0; n < a.length; n += 4) { ctx.moveTo(a[n], a[n + 1]); ctx.lineTo(a[n + 2], a[n + 3]); }
      ctx.stroke(); a.length = 0;
    }
  }

  function layout() {
    W = innerWidth; H = innerHeight; scale = Math.min(W, H);
    dpr = clamp(Math.min(devicePixelRatio || 1, 1.75) * rs, 0.5, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    s = state.view === 'abstract' ? clamp(Math.max(W, H) / 100, 8, 19) : clamp(W / 88, 8, 18);
    if (state.type === 'D') s *= 0.95;
    if (state.type === 'E') s *= 0.62;
    if (state.type === 'F') s *= 0.5;                        // 픽셀 소팅: 가는 기둥들
    if (state.type === 'G') s *= 0.6;                       // 필름은 연속 톤: 촘촘히 샘플링한다                       // 물방울은 이웃과 닿을 만큼 크게
    if (state.type === 'B') s *= 0.86;                       // 선 스크린은 촘촘하게
    if (state.type === 'C') s *= 1.3;                        // 픽셀은 큼직하게
    cols = Math.floor(W / s) + 2; rows = Math.floor(H / s) + 2;
    offX = (W - (cols - 1) * s) / 2; offY = (H - (rows - 1) * s) / 2;
    F = Math.min(W * 1.1, H * 1.15); cx = W * 0.5 - F * 0.11; cy = H * 0.45 - F * 0.27;
    src.width = cols * 3; src.height = rows * 3; small.width = cols; small.height = rows;
    dens = new Float32Array(cols * rows);
    IMG.width = cols; IMG.height = rows; imgData = ictx.createImageData(cols, rows);

      ctx.lineWidth = (n < 8 && TILE[n].t === saveT) ? 2 : 1; ctx.strokeRect(gx + 0.5, gy + 0.5, cw - 1, chh - 1);
      const lbl = (n < 8 ? TILE[n].t + ' ' + TYPES[TILE[n].t] : '센서 · 밝기 판정') + AUD.tag(n);
      ctx.fillStyle = 'rgba(0,0,0,0.62)'; ctx.fillRect(gx, gy + chh - 18, ctx.measureText(lbl).width + 12, 18);
      ctx.fillStyle = '#fff'; ctx.fillText(lbl, gx + 6, gy + chh - 15);
    }
    ctx.textBaseline = 'alphabetic';
  }
  function gridHit(px, py) {
    const gapPx = 6, cw = (W - gapPx * 4) / 3, chh = (H - gapPx * 4) / 3;
    const ci = Math.floor((px - gapPx) / (cw + gapPx)), ri = Math.floor((py - gapPx) / (chh + gapPx));
    if (ci < 0 || ci > 2 || ri < 0 || ri > 2) return -1;
    return ri * 3 + ci;
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    requestAnimationFrame(frame);
    if (document.hidden) return;                             // 탭이 가려져 있으면 아무것도 그리지 않는다
    SENSOR.update(dt);
    stepState(dt);
    AUD.update();
    if (AUD.on && ++sndUiTick % 6 === 0) soundUI();

    // 쉬는 화면은 움직이지 않는다: 한 번 그린 뒤로는 바뀔 때까지 건너뛴다
    const sig = state.type + state.view + inkMode + (state.grid ? 'g' : '') + Math.round(state.deg * 4) + W + 'x' + H;
    if (sig !== lastSig) { lastSig = sig; dirty = 3; }
    const still = live < 0.004 && offT < 0 && !state.grid && !SENSOR.on;
    if (still && dirty <= 0) return;
    if (still) dirty--; else dirty = 3;

    const t0 = performance.now();
    if (state.grid) renderGrid(dt); else renderScene(dt);
    ftEMA += (performance.now() - t0 - ftEMA) * 0.12;        // 한 프레임을 그리는 데 걸린 시간

    // 자동 화질: 느리면 그리는 픽셀을 줄이고, 여유가 있으면 되돌린다
    if (qMode === 'auto' && ++qTick > 20) {
      qTick = 0;
      const want = ftEMA > 45 ? -3 : ftEMA > 27 ? -2 : ftEMA > 19 ? -1 : ftEMA < 8.5 ? 1 : 0;
      if (want) {
        const n = clamp(rsIdx + want, 0, RS.length - 1);
        if (n !== rsIdx) { rsIdx = n; rs = RS[n]; layout(); dirty = 3; }
      }
    }
  }
  function setQuality(m) {
    qMode = m; qTick = 0;
    if (m === 'high') { rsIdx = RS.length - 1; rs = 1; }
    else if (m === 'low') { rsIdx = 1; rs = RS[1]; }
    layout(); dirty = 3;
    const b = document.getElementById('qBtn'); if (b) b.textContent = m === 'auto' ? '화질 자동' : m === 'high' ? '화질 선명' : '화질 가볍게';
  }

  // 조작
  const autoBtn = document.getElementById('auto');
  function setAuto(on) {
    state.auto = on; autoBtn.setAttribute('aria-pressed', on); autoBtn.textContent = on ? '❚❚' : '▶';
    if (on) clock = state.deg < CLOSED ? 1.2 : 5.8 + 9 * (1 - Math.sqrt(clamp((state.deg - CLOSED) / (110 - CLOSED), 0, 1)));
  }
  autoBtn.addEventListener('click', () => setAuto(!state.auto));
  degEl.addEventListener('input', () => { setAuto(false); state.deg = +degEl.value; syncSlider(); });

  // 빠른 각도: 그 각도로 부드럽게 옮겨 간다 (닫힘은 실제로 닫히는 순간을 보여주려고 곧장)
  let gotoT = null;
  document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => { setAuto(false); gotoT = +b.dataset.goto; }));

  function press(attr, val) {
    document.querySelectorAll('[data-' + attr + ']').forEach(b => b.setAttribute('aria-pressed', b.dataset[attr] === val));
  }
  const TYPES = { A: '흑백 물결', B: '잉크 선', C: '열화상', D: '성운', E: '필름', F: '픽셀 소팅', G: '액체 크롬', H: '서툰 모델링' };
  function setType(t) {
    state.type = t; state.mode = t === 'B' ? 'dot' : 'seq';
    document.getElementById('viewSeg').style.display = t === 'H' ? 'none' : 'flex'; press('type', t); densKey = '';
    document.getElementById('inkGroup').style.display = t === 'A' ? 'flex' : 'none';
    document.getElementById('pillType').textContent = t + ' ' + TYPES[t];
    soundUI();
    MOTES.length = 0; layout();
    const b = document.querySelector('[data-type="' + t + '"]'); if (b) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }
  function setView(v) { state.view = v; press('view', v); layout(); }
  document.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => setType(b.dataset.type)));
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  document.querySelectorAll('[data-ink]').forEach(b => b.addEventListener('click', () => {
    document.documentElement.setAttribute('data-ink', b.dataset.ink); press('ink', b.dataset.ink); readTheme();
  }));

  const gridBtn = document.getElementById('gridBtn'), senBtn = document.getElementById('senBtn');
  function setGrid(g) { state.grid = g; gridBtn.setAttribute('aria-pressed', g); document.body.classList.toggle('grid', g); layout(); soundUI(); }
  document.getElementById('backBtn').addEventListener('click', () => setGrid(true));
  gridBtn.addEventListener('click', () => setGrid(!state.grid));
  const QC = ['auto', 'high', 'low'];
  document.getElementById('qBtn').addEventListener('click', () => setQuality(QC[(QC.indexOf(qMode) + 1) % 3]));
  const calBtn = document.getElementById('calBtn'), calOBtn = document.getElementById('calOBtn');
  senBtn.addEventListener('click', async () => {
    if (!SENSOR.on) { senBtn.textContent = '연결 중'; await SENSOR.start(); state.sensorDrive = SENSOR.on; }
    else { SENSOR.stop(); state.sensorDrive = false; SENSOR.err = ''; }
    senBtn.textContent = '센서'; senBtn.setAttribute('aria-pressed', !!state.sensorDrive);
    calBtn.style.display = calOBtn.style.display = SENSOR.on ? 'inline-flex' : 'none';
    if (SENSOR.err) senBtn.title = SENSOR.err;
  });
  calBtn.addEventListener('click', () => SENSOR.calibrate());
  calOBtn.addEventListener('click', () => SENSOR.calibrateOpen());
  const sndBtn = document.getElementById('sndBtn'), sndFile = document.getElementById('sndFile');
  sndBtn.addEventListener('click', () => AUD.setOn(!AUD.on));
  document.getElementById('sndAdd').addEventListener('click', () => sndFile.click());
  document.getElementById('testBtn').addEventListener('click', async () => { if (!AUD.on) await AUD.setOn(true); AUD.loadTest(); });
  sndFile.addEventListener('change', () => { const fs = [...sndFile.files]; sndFile.value = ''; if (fs.length) AUD.addFiles(fs, -1); });
  // 파일을 끌어다 놓기: 그리드에서는 놓은 칸으로, 한 화면에서는 지금 보고 있는 칸으로
  const dropHint = document.getElementById('dropHint'); let dragDepth = 0;
  const hasFiles = (ev) => ev.dataTransfer && [...(ev.dataTransfer.types || [])].includes('Files');
  addEventListener('dragenter', ev => { if (!hasFiles(ev)) return; ev.preventDefault(); dragDepth++; dropHint.hidden = false; });
  addEventListener('dragover', ev => { if (hasFiles(ev)) ev.preventDefault(); });
  addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; dropHint.hidden = true; } });
  addEventListener('drop', ev => {
    if (!hasFiles(ev)) return;
    ev.preventDefault(); dragDepth = 0; dropHint.hidden = true;
    const fs = [...ev.dataTransfer.files].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|ogg|opus|flac)$/i.test(f.name));
    if (!fs.length) return;
    let forced = -1;
    if (fs.length === 1) forced = state.grid ? gridHit(ev.clientX, ev.clientY) : 'ABCDEFGH'.indexOf(state.type);
    AUD.addFiles(fs, forced);
  });
  // 브라우저는 사용자가 한 번 건드려야 소리를 낸다
  addEventListener('pointerdown', () => { if (AUD.on && AUD.ctx && AUD.ctx.state !== 'running') { AUD.unlockIOS(); AUD.ctx.resume().then(() => { AUD.msg = ''; soundUI(); }); } }, { capture: true });
  const panel = document.getElementById('panel'), pill = document.getElementById('pill');
  function setFold(f) { panel.classList.toggle('folded', f); document.body.classList.toggle('folded', f); }
  document.getElementById('fold').addEventListener('click', () => setFold(true));
  pill.addEventListener('click', () => setFold(false));

  // 화면: 좌우로 끌면 문, 두 번 탭하면 패널
  let dragX = null, lastTap = 0, moved = 0;
  state.sensorDrive = false;
  mainCv.addEventListener('pointerdown', ev => { dragX = ev.clientX; moved = 0; mainCv.setPointerCapture(ev.pointerId); });
  mainCv.addEventListener('pointermove', ev => {
    if (dragX === null) return;
    const dx = ev.clientX - dragX; moved += Math.abs(dx); if (moved < 4) return;
    setAuto(false); gotoT = null;
    state.deg = clamp(state.deg + dx / W * 150, 0, 110); dragX = ev.clientX; syncSlider();
  });
  const endDrag = (ev) => {
    if (dragX !== null && moved < 6) {
      if (state.grid) {                                   // 그리드에서 한 칸을 고르면 그 타입으로 들어간다
        const n = gridHit(ev ? ev.clientX : 0, ev ? ev.clientY : 0);
        if (n >= 0 && n < 8) { setType(TILE[n].t); setGrid(false); }
        else if (n === 8) senBtn.click();
        dragX = null; return;
      }
      const now = performance.now(); if (now - lastTap < 320) { setFold(!panel.classList.contains('folded')); lastTap = 0; } else lastTap = now;
    }
    dragX = null;
  };
  mainCv.addEventListener('pointerup', endDrag); mainCv.addEventListener('pointercancel', () => { dragX = null; });

  addEventListener('keydown', ev => {
    if (ev.target.tagName === 'INPUT' && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) return;
    const k = ev.key;
    if (k === ' ') { ev.preventDefault(); setAuto(!state.auto); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') { setAuto(false); gotoT = null; state.deg = clamp(state.deg + (k === 'ArrowRight' ? 1 : -1) * (ev.shiftKey ? 10 : 2), 0, 110); syncSlider(); }
    else if (k >= '1' && k <= '8') setType('ABCDEFGH'[+k - 1]);
    else if (k === 'v' || k === 'V') setView(state.view === 'fridge' ? 'abstract' : 'fridge');
    else if (k === 'g' || k === 'G') setGrid(!state.grid);
    else if (k === 'Escape' && !state.grid) setGrid(true);
    else if (k === 'q' || k === 'Q') setQuality(QC[(QC.indexOf(qMode) + 1) % 3]);
    else if (k === 'm' || k === 'M') AUD.setOn(!AUD.on);
    else if (k === 'h' || k === 'H') setFold(!panel.classList.contains('folded'));
    else if (k === '0') { setAuto(false); gotoT = 0; }
  });

  addEventListener('resize', () => { layout(); dirty = 3; });
  addEventListener('visibilitychange', () => { dirty = 3; last = performance.now(); });
  document.documentElement.setAttribute('data-ink', 'black');
  if ((navigator.hardwareConcurrency || 4) <= 4 || innerWidth * innerHeight > 1100000) { rsIdx = 3; rs = RS[3]; }
  readTheme(); layout(); syncSlider();
  setAuto(state.auto);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
